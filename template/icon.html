<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waline init test</title>
  </head>
  <body>
    <div id="waline" style="max-width: 800px; margin: 0 auto"></div>
